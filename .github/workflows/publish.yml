name: Publish Imperium Dashboards

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: publish-dashboards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build growth + operational HTML
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node build.js

      - name: Publish to target repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is EMPTY or not set on imperium-dashboard. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          git config --global user.name "imperium-bot"
          git config --global user.email "bot@imperiumluxurymiami.com"

          publish () {
            REPO="$1"; SRC="$2"; DEST="$3"
            rm -rf _target
            if ! git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" _target 2> err.txt; then
              echo "::error::CLONE/AUTH failed for ${REPO}: $(tr -d '\r' < err.txt | tr '\n' ' ' | tail -c 300)"
              exit 1
            fi
            cp "$SRC" "_target/${DEST}"
            cd _target
            if git diff --quiet; then
              echo "No changes for $REPO."
            else
              git add "${DEST}"
              git commit -m "chore: publish dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
              if ! git push 2> perr.txt; then
                echo "::error::PUSH failed for ${REPO}: $(tr -d '\r' < perr.txt | tr '\n' ' ' | tail -c 300)"
                exit 1
              fi
            fi
            cd ..
          }

          publish "raizerandco/imperium-ceo"  "out/growth/index.html"       "index.html"
          publish "raizerandco/imperium-ops"  "out/operational/index.html"  "index.html"
